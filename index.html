<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>the feature lab</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!-- Warm the cache for the content pages so clicking a planet lands instantly
       (no first-visit lag/flash while the font + planet icons fetch). -->
  <link rel="prefetch" href="/fonts/Jersey10.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="prefetch" href="/planets/icon_sorbetlike.png" as="image" />
  <link rel="prefetch" href="/planets/icon_earthlike.png" as="image" />
  <link rel="prefetch" href="/planets/icon_spiky.png" as="image" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #hud {
      position: fixed;
      right: 12px;
      bottom: 12px;
      font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: #9fd6ff;
      background: rgba(6, 10, 20, 0.55);
      border: 1px solid rgba(120, 170, 255, 0.25);
      border-radius: 6px;
      padding: 8px 10px;
      pointer-events: none;
      user-select: none;
      white-space: pre;
      text-shadow: 0 0 6px rgba(80, 140, 255, 0.4);
    }
    #hud b { color: #d8ecff; font-weight: 600; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
