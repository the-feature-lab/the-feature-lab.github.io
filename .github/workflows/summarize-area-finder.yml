# Daily Claude summaries of research-area-finder comments
# (see resources/research-area-finder/README.md). Writes to Supabase only, so
# no rebuild or redeploy is needed. The summary step skips cleanly until the
# secrets exist; the keep-alive ping runs regardless.
name: Summarize research area finder comments

on:
  schedule:
    - cron: "17 6 * * *" # once a day, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: area-finder-summaries
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Free-tier Supabase projects pause after ~7 days without activity, which
      # takes the page down. A daily read of the public topics table (public
      # publishable key, same one the page ships) keeps the project awake.
      - name: Keep Supabase awake
        run: |
          curl -fsS -m 30 -o /dev/null \
            -H "apikey: sb_publishable_q4FwRQVyAX3MNzz8LeZsHw_Nw2o-8bi" \
            "https://mzwsarpqletxgtbseiwh.supabase.co/rest/v1/topics?select=name&limit=1" \
            && echo "Supabase reachable" \
            || echo "::warning::Supabase unreachable (project paused? restore it in the dashboard)"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Summarize
        run: node scripts/summarize-area-finder.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
