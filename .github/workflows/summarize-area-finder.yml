# Daily Claude summaries of research-area-finder comments
# (see resources/research-area-finder/README.md). Writes to Supabase only, so
# no rebuild or redeploy is needed. Skips cleanly until the secrets exist.
name: Summarize research area finder comments

on:
  schedule:
    - cron: "17 6 * * *" # once a day, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: area-finder-summaries
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Summarize
        run: node scripts/summarize-area-finder.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
